<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="prod.title">Products - CZEVIP Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="app-shell" class="app">
  <main class="main">
    <div class="page-head">
      <div>
        <h1 data-i18n="prod.title">Products</h1>
        <div class="sub" id="total-line" data-i18n="prod.loading">Loading...</div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" id="btn-seed" data-i18n="prod.seed">Seed from products.json</button>
        <button class="btn btn-primary" id="btn-new" data-i18n="prod.addProduct">Add product</button>
        <button class="btn btn-ghost" id="btn-ai-all" title="Regenerate every product description with AI" data-i18n="prod.aiRefreshAll">AI refresh all</button>
        <button class="btn btn-ghost" id="btn-quick" data-i18n="prod.quickAdd">Quick add</button>
      </div>
    </div>
    <div class="filters">
      <div class="group" data-filter="all">
        <button class="chip active" data-val="1" data-i18n="prod.allInclInactive">All (incl. inactive)</button>
        <button class="chip" data-val="0" data-i18n="prod.activeOnly">Active only</button>
      </div>
    </div>
    <div class="bulk-bar" id="bulk-bar">
      <span class="count" id="bulk-count">0</span>
      <button class="clear" id="bulk-clear" data-i18n="bulk.clear">Clear</button>
      <span style="opacity:.5">|</span>
      <select id="bulk-action">
        <option value="" data-i18n="bulk.action">Bulk action</option>
        <option value="set_price" data-i18n="bulk.setPrice">Set price</option>
        <option value="adjust_price" data-i18n="bulk.adjustPrice">Adjust by %</option>
        <option value="set_badge" data-i18n="bulk.setBadge">Set badge</option>
        <option value="clear_badge" data-i18n="bulk.clearBadge">Clear badge</option>
        <option value="set_availability" data-i18n="bulk.setAvail">Set availability</option>
        <option value="set_featured">featured</option>
        <option value="archive" data-i18n="bulk.archive">Archive</option>
      </select>
      <input type="number" step="0.01" id="bulk-value" placeholder="value" style="display:none">
      <select id="bulk-availability" style="display:none">
        <option value="in_stock">in_stock</option>
        <option value="out_of_stock">out_of_stock</option>
        <option value="preorder">preorder</option>
      </select>
      <button class="btn btn-sm" id="bulk-apply" data-i18n="bulk.apply">Apply</button>
    </div>
    <table class="table">
      <thead><tr><th class="check-cell"><input type="checkbox" id="check-all"></th><th></th><th data-i18n="prod.colId">ID</th><th data-i18n="prod.colName">Name</th><th data-i18n="prod.colCat">Cat</th><th data-i18n="prod.colPrice">Price</th><th data-i18n="prod.colBadge">Badge</th><th data-i18n="prod.colFlags">Flags</th><th data-i18n="prod.colStatus">Status</th><th></th></tr></thead>
      <tbody id="rows"><tr class="empty-row"><td colspan="10" data-i18n="prod.loading">Loading...</td></tr></tbody>
    </table>
  </main>
</div>
<script src="/admin/i18n.js"></script>
<script src="/admin/admin.js"></script>
<script>
  (async function () {
    const a = window.czAdmin;
    const I = window.czI18n.t;
    await a.boot('products');
    let showAll = true;
    let items = [];
    const selected = new Set();

    function refreshBulkBar() {
      const bar = a.$('#bulk-bar');
      if (selected.size > 0) {
        bar.classList.add('show');
        a.$('#bulk-count').textContent = I('bulk.selected', { n: selected.size });
      } else {
        bar.classList.remove('show');
      }
      const action = a.$('#bulk-action').value;
      a.$('#bulk-value').style.display = (action === 'set_price' || action === 'adjust_price' || action === 'set_badge') ? '' : 'none';
      a.$('#bulk-availability').style.display = (action === 'set_availability') ? '' : 'none';
    }

    async function load() {
      try {
        const r = await a.api('GET', '/products?all=' + (showAll ? '1' : '0'));
        items = r.items;
        a.$('#total-line').textContent = showAll ? I('prod.totalAll', { n: r.items.length }) : I('prod.totalActive', { n: r.items.length });
        const tbody = a.$('#rows');
        if (!r.items.length) {
          tbody.innerHTML = '<tr class="empty-row"><td colspan="10">' + I('prod.empty') + '</td></tr>';
          return;
        }
        tbody.innerHTML = r.items.map(p =>
          '<tr data-id="' + a.esc(p.id) + '">' +
            '<td class="check-cell"><input type="checkbox" class="row-check" data-id="' + a.esc(p.id) + '"' + (selected.has(p.id) ? ' checked' : '') + '></td>' +
            '<td><div class="thumb">' + (p.primary_image ? '<img src="/' + p.primary_image + '" alt="">' : 'no img') + '</div></td>' +
            '<td><code style="font-size:12px">' + a.esc(p.id) + '</code></td>' +
            '<td>' + a.esc(p.name) + (p.color ? ' <span class="muted">(' + a.esc(p.color) + ')</span>' : '') + '</td>' +
            '<td>' + a.esc(p.cat) + '</td>' +
            '<td class="num">' + a.money(p.price) + (p.compare_at ? ' <s class="muted">' + a.money(p.compare_at) + '</s>' : '') + '</td>' +
            '<td>' + (p.badge ? '<span class="badge badge-new">' + a.esc(p.badge) + '</span>' : '') + '</td>' +
            '<td>' + (p.featured ? '<span class="badge badge-active">' + I('prod.featured') + '</span> ' : '') + (p.new ? '<span class="badge badge-new">' + I('prod.new') + '</span>' : '') + '</td>' +
            '<td>' + (p.active !== false ? '<span class="badge badge-active">' + I('prod.active') + '</span>' : '<span class="badge badge-inactive">' + I('prod.inactive') + '</span>') + '</td>' +
            '<td class="flex gap-8"><button class="btn btn-sm btn-ghost" data-edit="' + a.esc(p.id) + '">' + I('prod.edit') + '</button> ' +
              '<button class="btn btn-sm btn-ghost" data-ai="' + a.esc(p.id) + '" title="Regenerate description with AI">' + I('prod.aiOne') + '</button> ' +
              '<button class="btn btn-sm btn-ghost" data-duplicate="' + a.esc(p.id) + '" title="Duplicate">' + I('prod.duplicate') + '</button> ' +
              (p.active !== false ? '<button class="btn btn-sm btn-danger" data-del="' + a.esc(p.id) + '">' + I('prod.archive') + '</button>' : '') + '</td>' +
          '</tr>'
        ).join('');
        a.$$('button[data-edit]').forEach(b => b.addEventListener('click', () => openEditor(b.getAttribute('data-edit'))));
        a.$$('button[data-duplicate]').forEach(b => b.addEventListener('click', () => duplicateProduct(b.getAttribute('data-duplicate'))));
        a.$$('button[data-ai]').forEach(b => b.addEventListener('click', () => aiRegenerateOne(b.getAttribute('data-ai'), b)));
        a.$$('button[data-del]').forEach(b => b.addEventListener('click', () => archiveProduct(b.getAttribute('data-del'))));
        a.$$('.row-check').forEach(cb => {
          cb.addEventListener('change', () => {
            const id = cb.getAttribute('data-id');
            if (cb.checked) selected.add(id); else selected.delete(id);
            const tr = cb.closest('tr'); if (tr) tr.classList.toggle('selected', cb.checked);
            refreshBulkBar();
          });
        });
        a.$('#check-all').checked = selected.size === items.length && items.length > 0;
      } catch (e) { a.toast(I('prod.loadFailed') + ': ' + e.message, 'error'); }
    }

    function openEditor(id) {
      const p = { id: '', slug: '', name: '', color: '', cat: 'cap', price: 0, compare_at: null, material: '', origin: 'Imported', weight_lb: 0.3, badge: '', featured: false, new: false, sizes: ['One size'], colors: [], gtin: '', mpn: '', identifier_exists: false, condition: 'new', availability: 'in_stock', primary_image: '', images: [], desc: '', active: true };
      let mode = 'create';
      const finish = (product) => {
        const html = editorHtml(product, mode);
        a.openModal(html, { large: true });
        bindEditor(product, mode);
      };
      if (id) {
        mode = 'edit';
        a.api('GET', '/products/' + id).then(r => finish(r.item)).catch(e => a.toast(I('prod.loadFailed') + ': ' + e.message, 'error'));
      } else { finish(p); }
    }

    function editorHtml(p, mode) {
      return '<div class="modal-head"><h2>' + (mode === 'edit' ? I('edit.editProduct', { name: p.name }) : I('edit.newProduct')) + '</h2><button class="close-x" onclick="czAdmin.closeModal()">&times;</button></div>' +
        '<form id="prod-form" class="modal-body">' +
          '<div class="form-row">' +
            '<div class="field"><label data-i18n="edit.field.id">ID</label><input name="id" value="' + a.esc(p.id) + '" ' + (mode === 'edit' ? 'readonly' : '') + ' required></div>' +
            '<div class="field"><label data-i18n="edit.field.slug">Slug</label><input name="slug" value="' + a.esc(p.slug) + '" required></div>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="field"><label data-i18n="edit.field.name">Name</label><input name="name" value="' + a.esc(p.name) + '" required></div>' +
            '<div class="field"><label data-i18n="edit.field.color">Color</label><input name="color" value="' + a.esc(p.color) + '"></div>' +
          '</div>' +
          '<div class="form-row three">' +
            '<div class="field"><label data-i18n="edit.field.cat">Category</label><select name="cat">' + ['dad','mom','wife','set','fedora','panama','beret','cap','sun','beanie'].map(c => '<option' + (p.cat === c ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>' +
            '<div class="field"><label data-i18n="edit.field.price">Price (USD)</label><input type="number" step="0.01" name="price" value="' + a.esc(p.price) + '" required></div>' +
            '<div class="field"><label data-i18n="edit.field.compareAt">Compare-at</label><input type="number" step="0.01" name="compare_at" value="' + (p.compare_at == null ? '' : a.esc(p.compare_at)) + '"></div>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="field"><label data-i18n="edit.field.material">Material</label><input name="material" value="' + a.esc(p.material) + '"></div>' +
            '<div class="field"><label data-i18n="edit.field.origin">Origin</label><input name="origin" value="' + a.esc(p.origin) + '"></div>' +
          '</div>' +
          '<div class="form-row three">' +
            '<div class="field"><label data-i18n="edit.field.weight">Weight (lb)</label><input type="number" step="0.01" name="weight_lb" value="' + a.esc(p.weight_lb) + '"></div>' +
            '<div class="field"><label data-i18n="edit.field.badge">Badge</label><input name="badge" value="' + a.esc(p.badge || '') + '"></div>' +
            '<div class="field"><label data-i18n="edit.field.mpn">MPN</label><input name="mpn" value="' + a.esc(p.mpn || '') + '"></div>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="field"><label data-i18n="edit.field.sizes">Sizes</label><input name="sizes" value="' + a.esc((p.sizes || []).join(', ')) + '"></div>' +
            '<div class="field"><label data-i18n="edit.field.colors">Colors</label><input name="colors" value="' + a.esc((p.colors || []).join(', ')) + '"></div>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="field"><label data-i18n="edit.field.primaryImage">Primary image</label><input name="primary_image" value="' + a.esc(p.primary_image || '') + '" placeholder="assets/caps/dad/dad-cap-white.png"></div>' +
            '<div class="field"><label data-i18n="edit.field.images">Other images</label><input name="images" value="' + a.esc((p.images || []).join(', ')) + '"></div>' +
          '</div>' +
          '<div class="field">' +
            '<label>Product images <span style="color:var(--muted);font-size:12px;font-weight:400"> - upload multiple, click star to set primary, X to remove. Stored as base64 in D1.</span></label>' +
            '<div class="img-uploader">' +
              '<input type="file" accept="image/*" multiple id="img-file-input" style="display:none">' +
              '<div class="img-dropzone" id="img-dropzone">' +
                '<button type="button" class="btn btn-sm btn-ghost" id="img-pick">+ Upload images</button>' +
                '<span style="color:var(--muted);font-size:12px;margin-left:12px">or drag and drop image files here</span>' +
              '</div>' +
              '<div class="img-previews" id="img-previews"></div>' +
              '<input type="hidden" name="primary_image" id="img-primary" value="' + a.esc(p.primary_image || '') + '">' +
              '<input type="hidden" name="images_json" id="img-list" value="' + a.esc(JSON.stringify(p.images || [])) + '">' +
            '</div>' +
          '</div>' +
          '<div class="field"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><label data-i18n="edit.field.desc" style="flex:1;margin:0">Description</label><button type="button" class="btn btn-sm btn-ghost" id="prod-ai-write">\u2728 AI write</button></div><textarea name="desc" id="prod-desc" rows="4">' + a.esc(p.desc || '') + '</textarea></div>' +
          '<div class="form-row three">' +
            '<div class="field"><label data-i18n="edit.field.availability">Availability</label><select name="availability"><option value="in_stock"' + (p.availability === 'in_stock' ? ' selected' : '') + '>In stock</option><option value="out_of_stock"' + (p.availability === 'out_of_stock' ? ' selected' : '') + '>Out of stock</option><option value="preorder"' + (p.availability === 'preorder' ? ' selected' : '') + '>Preorder</option></select></div>' +
            '<div class="field"><label data-i18n="edit.field.condition">Condition</label><select name="condition"><option value="new"' + (p.condition === 'new' ? ' selected' : '') + '>New</option><option value="used"' + (p.condition === 'used' ? ' selected' : '') + '>Used</option></select></div>' +
            '<div class="field"><label data-i18n="edit.field.gtin">GTIN</label><input name="gtin" value="' + a.esc(p.gtin || '') + '"></div>' +
          '</div>' +
          '<div class="flex gap-12" style="margin-top:6px">' +
            '<label class="checkbox-row"><input type="checkbox" name="featured"' + (p.featured ? ' checked' : '') + '> <span data-i18n="edit.field.featured">Featured</span></label>' +
            '<label class="checkbox-row"><input type="checkbox" name="new"' + (p.new ? ' checked' : '') + '> <span data-i18n="edit.field.new">Marked as new</span></label>' +
            '<label class="checkbox-row"><input type="checkbox" name="active"' + (p.active !== false ? ' checked' : '') + '> <span data-i18n="edit.field.active">Active</span></label>' +
          '</div>' +
        '</form>' +
        '<div class="modal-foot">' +
          '<button class="btn btn-ghost" onclick="czAdmin.closeModal()">' + I('edit.cancel') + '</button>' +
          '<button class="btn btn-primary" id="prod-save">' + (mode === 'edit' ? I('edit.save') : I('edit.create')) + '</button>' +
        '</div>';
    }

    function bindEditor(p, mode) {
      window.czI18n.applyAll(a.$('#prod-form'));
      const form = a.$('#prod-form');

      // === Image uploader state and helpers ===
      // imagesList holds dataURL strings; primaryIdx is the index in imagesList (or '' for existing path).
      const state = { images: [], primaryIdx: -1, existingPrimary: (p.primary_image || '') };
      try {
        const pre = JSON.parse(form.querySelector('#img-list').value || '[]');
        if (Array.isArray(pre)) state.images = pre.slice();
        if (state.existingPrimary) {
          state.primaryIdx = state.images.indexOf(state.existingPrimary);
        }
      } catch (e) {}

      function renderPreviews() {
        const host = form.querySelector('#img-previews');
        if (!host) return;
        host.innerHTML = state.images.map((src, i) => {
          const isPrimary = i === state.primaryIdx;
          return '<div class="img-preview' + (isPrimary ? ' is-primary' : '') + '" data-idx="' + i + '">' +
            '<img src="' + a.esc(src).replace(/"/g, '&quot;') + '" alt="">' +
            '<div class="img-actions">' +
              '<button type="button" class="img-star" data-act="primary" title="Set as primary">' + (isPrimary ? '★' : '☆') + '</button>' +
              '<button type="button" class="img-x" data-act="remove" title="Remove">×</button>' +
            '</div>' +
          '</div>';
        }).join('');
        const primary = state.primaryIdx >= 0 ? state.images[state.primaryIdx] : '';
        form.querySelector('#img-primary').value = primary;
        form.querySelector('#img-list').value = JSON.stringify(state.images);
      }
      renderPreviews();

      function readFiles(files) {
        Array.from(files).forEach(file => {
          if (!file.type || file.type.indexOf('image/') !== 0) return;
          if (file.size > 600 * 1024) { a.toast('Image "' + file.name + '" too large (max 600 KB)', 'error'); return; }
          const reader = new FileReader();
          reader.onload = ev => {
            state.images.push(String(ev.target.result || ''));
            if (state.primaryIdx < 0 && !state.existingPrimary) state.primaryIdx = 0;
            renderPreviews();
          };
          reader.readAsDataURL(file);
        });
      }

      const fileInput = form.querySelector('#img-file-input');
      const dropzone = form.querySelector('#img-dropzone');
      if (fileInput && dropzone) {
        form.querySelector('#img-pick').addEventListener('click', e => { e.preventDefault(); fileInput.click(); });
        fileInput.addEventListener('change', e => { readFiles(e.target.files); e.target.value = ''; });
        ['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
        ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
        dropzone.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files) readFiles(e.dataTransfer.files); });
      }
      form.querySelector('#img-previews').addEventListener('click', e => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        const card = btn.closest('.img-preview');
        if (!card) return;
        const idx = Number(card.getAttribute('data-idx'));
        const act = btn.getAttribute('data-act');
        if (act === 'primary') { state.primaryIdx = idx; }
        else if (act === 'remove') { state.images.splice(idx, 1); if (state.primaryIdx === idx) state.primaryIdx = state.images.length ? 0 : -1; else if (state.primaryIdx > idx) state.primaryIdx--; }
        renderPreviews();
      });

      a.$('#prod-save').addEventListener('click', async () => {
      const aiBtn = form.querySelector('#prod-ai-write');
      if (aiBtn) aiBtn.addEventListener('click', async () => {
        const d = Object.fromEntries(new FormData(form).entries());
        if (!d.name) { a.toast('Fill in the name first', 'error'); return; }
        const orig = aiBtn.textContent;
        aiBtn.disabled = true; aiBtn.textContent = '\u2728 Writing...';
        try {
          const r = await a.api('POST', '/ai-describe', {
            name: d.name, cat: d.cat || 'cap', color: d.color || '',
            material: d.material || '', origin: d.origin || '',
            price: Number(d.price) || 0, badge: d.badge || ''
          });
          if (r && r.description) {
            const ta = form.querySelector('#prod-desc');
            if (ta) ta.value = r.description;
            a.toast('Description generated', 'success');
          } else { a.toast('AI returned no text', 'error'); }
        } catch (e) { a.toast('AI write failed: ' + e.message, 'error'); }
        finally { aiBtn.disabled = false; aiBtn.textContent = orig; }
      });

      a.$('#prod-save').addEventListener('click', async () => {
        const data = Object.fromEntries(new FormData(form).entries());
        ['featured','new','active','identifier_exists'].forEach(k => { data[k] = form.querySelector('[name="' + k + '"]').checked; });
        data.sizes = data.sizes ? data.sizes.split(',').map(s => s.trim()).filter(Boolean) : [];
        data.colors = data.colors ? data.colors.split(',').map(s => s.trim()).filter(Boolean) : [];
        try { data.images = JSON.parse(data.images_json || '[]'); } catch (e) { data.images = []; }
        delete data.images_json;
        ['price','compare_at','weight_lb'].forEach(k => { if (data[k] === '') data[k] = null; });
        try {
          if (mode === 'edit') await a.api('PUT', '/products/' + p.id, data);
          else await a.api('POST', '/products', data);
          a.toast(mode === 'edit' ? I('prod.saved') : I('prod.created'), 'success');
          a.closeModal();
          load();
        } catch (e) { a.toast(I('prod.saveFailed') + ': ' + e.message, 'error'); }
      });
    }

    async function archiveProduct(id) {
      if (!confirm(I('prod.archiveConfirm', { id }))) return;
      try { await a.api('DELETE', '/products/' + id); a.toast(I('prod.archived'), 'success'); selected.delete(id); load(); }
      catch (e) { a.toast(I('prod.archiveFailed') + ': ' + e.message, 'error'); }
    }

    async function duplicateProduct(id) {
      try {
        const r = await a.api('POST', '/products/' + id + '/duplicate');
        a.toast('Duplicated as ' + r.id, 'success');
        load();
      } catch (e) { a.toast('Duplicate failed: ' + e.message, 'error'); }
    }

    async function aiRegenerateOne(id, btn) {
      const orig = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = '...'; }
      try {
        const r = await a.api('POST', '/ai-regenerate', { id: id });
        if (r && r.ok) {
          a.toast(I('prod.aiRefreshed', { name: id }), 'success');
          load();
        } else {
          a.toast((r && r.error) || 'AI failed', 'error');
        }
      } catch (e) { a.toast('AI failed: ' + e.message, 'error'); }
      finally { if (btn) { btn.disabled = false; btn.textContent = orig; } }
    }

    async function aiRegenerateAll() {
      const items = (items || []).filter(p => p.active !== false);
      if (!items.length) { a.toast('No active products to refresh', 'error'); return; }
      if (!confirm(I('prod.aiRefreshAllConfirm', { n: items.length }))) return;
      const btn = a.$('#btn-ai-all');
      const orig = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = 'AI 0/' + items.length; }
      try {
        const r = await a.api('POST', '/ai-regenerate', { all: true, scope: 'active' });
        a.toast(I('prod.aiBatchDone', { ok: r.regenerated, failed: r.failed, total: r.total }), r.failed ? 'error' : 'success');
        load();
      } catch (e) { a.toast('AI batch failed: ' + e.message, 'error'); }
      finally { if (btn) { btn.disabled = false; btn.textContent = orig; } }
    }

    a.$('#btn-new').addEventListener('click', () => openEditor(null));
    a.$('#btn-quick').addEventListener('click', () => openQuickAdd());
    a.$('#btn-ai-all').addEventListener('click', () => aiRegenerateAll());

    function openQuickAdd() {
      const html = '<div class="modal-head"><h2>' + I('prod.quickAddTitle') + '</h2><button class="close-x" onclick="czAdmin.closeModal()">&times;</button></div>' +
        '<form id="quick-form" class="modal-body">' +
          '<p style="color:var(--muted);font-size:13px;margin:0 0 12px">' + I('prod.quickAddDesc') + '</p>' +
          '<div class="form-row">' +
            '<div class="field"><label>Category</label><select name="cat" id="q-cat">' + ['dad','mom','wife','set','fedora','panama','beret','cap','sun','beanie'].map(c => '<option' + (c === 'cap' ? ' selected' : '') + '>' + c + '</option>').join('') + '</select></div>' +
            '<div class="field"><label>SKU (auto) <span style="color:var(--muted);font-size:12px;font-weight:400">- editable</span></label><input name="id" id="q-id" pattern="[a-z0-9-]+" placeholder="auto-generated"></div>' +
          '</div>' +
          '<div class="form-row">' +
            '<div class="field"><label>Product name <span style="color:#c44">*</span></label><input name="name" required placeholder="Brown Felt Fedora"></div>' +
            '<div class="field"><label>Price (USD) <span style="color:#c44">*</span></label><input type="number" step="0.01" name="price" required value="34"></div>' +
          '</div>' +
          '<div class="field">' +
            '<label>Images <span style="color:var(--muted);font-size:12px;font-weight:400"> - upload one or more (max 600 KB each)</span></label>' +
            '<div class="img-uploader">' +
              '<input type="file" accept="image/*" multiple id="q-img-input" style="display:none">' +
              '<div class="img-dropzone" id="q-img-drop">' +
                '<button type="button" class="btn btn-sm btn-ghost" id="q-img-pick">+ Upload images</button>' +
                '<span style="color:var(--muted);font-size:12px;margin-left:12px">or drag and drop here</span>' +
              '</div>' +
              '<div class="img-previews" id="q-img-previews"></div>' +
            '</div>' +
          '</div>' +
          '<div class="field">' +
            '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">' +
              '<label style="flex:1;margin:0">Description <span style="color:var(--muted);font-size:12px;font-weight:400"> - auto-fill with AI</span></label>' +
              '<button type="button" class="btn btn-sm btn-ghost" id="q-ai-write">\u2728 AI write</button>' +
            '</div>' +
            '<textarea name="desc" id="q-desc" rows="4" placeholder="Click AI write to auto-generate from name + category."></textarea>' +
          '</div>' +
        '</form>' +
        '<div class="modal-foot">' +
          '<button class="btn btn-ghost" onclick="czAdmin.closeModal()">Cancel</button>' +
          '<button class="btn btn-primary" id="q-save">' + I('prod.quickAddSubmit') + '</button>' +
        '</div>';
      a.openModal(html, { large: true });
      const state = { images: [], primaryIdx: -1 };
      // Auto-generate SKU from name + category, like 'fedora-brown-felt-fedora-a1b'
      function autoSku(name, cat) {
        const slug = String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const short = Math.random().toString(36).slice(2, 5);
        return (cat ? cat + '-' : '') + (slug || 'product') + '-' + short;
      }
      function refreshSkuPreview() {
        const idEl = a.$('#q-id');
        if (!idEl || idEl.value) return;
        const name = a.$('#quick-form [name="name"]').value;
        const cat = a.$('#q-cat').value;
        idEl.placeholder = autoSku(name, cat);
      }
      a.$('#quick-form [name="name"]').addEventListener('input', refreshSkuPreview);
      a.$('#q-cat').addEventListener('change', refreshSkuPreview);

      function render() {
        const host = a.$('#q-img-previews');
        host.innerHTML = state.images.map((src, i) =>
          '<div class="img-preview' + (i === state.primaryIdx ? ' is-primary' : '') + '" data-idx="' + i + '">' +
            '<img src="' + a.esc(src).replace(/"/g, '&quot;') + '" alt="">' +
            '<div class="img-actions">' +
              '<button type="button" data-act="primary" title="Set as primary">' + (i === state.primaryIdx ? '\u2605' : '\u2606') + '</button>' +
              '<button type="button" data-act="remove" title="Remove">\u00d7</button>' +
            '</div>' +
          '</div>'
        ).join('');
      }
      function read(files) {
        Array.from(files).forEach(f => {
          if (!f.type || f.type.indexOf('image/') !== 0) return;
          if (f.size > 600 * 1024) { a.toast('Image "' + f.name + '" too large (max 600 KB)', 'error'); return; }
          const r = new FileReader();
          r.onload = ev => { state.images.push(String(ev.target.result || '')); if (state.primaryIdx < 0) state.primaryIdx = 0; render(); };
          r.readAsDataURL(f);
        });
      }
      a.$('#q-img-pick').addEventListener('click', e => { e.preventDefault(); a.$('#q-img-input').click(); });
      a.$('#q-img-input').addEventListener('change', e => { read(e.target.files); e.target.value = ''; });
      const drop = a.$('#q-img-drop');
      ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
      ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
      drop.addEventListener('drop', e => { if (e.dataTransfer && e.dataTransfer.files) read(e.dataTransfer.files); });
      a.$('#q-img-previews').addEventListener('click', e => {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        const card = btn.closest('.img-preview');
        if (!card) return;
        const idx = Number(card.getAttribute('data-idx'));
        if (btn.getAttribute('data-act') === 'primary') state.primaryIdx = idx;
        else { state.images.splice(idx, 1); if (state.primaryIdx === idx) state.primaryIdx = state.images.length ? 0 : -1; else if (state.primaryIdx > idx) state.primaryIdx--; }
        render();
      });
      a.$('#q-save').addEventListener('click', async () => {
      a.$('#q-ai-write').addEventListener('click', async () => {
        const form = a.$('#quick-form');
        const data = Object.fromEntries(new FormData(form).entries());
        if (!data.name) { a.toast('Fill in the name first', 'error'); return; }
        const btn = a.$('#q-ai-write');
        const orig = btn.textContent;
        btn.disabled = true; btn.textContent = '\u2728 Writing...';
        try {
          const r = await a.api('POST', '/ai-describe', {
            name: data.name, cat: data.cat || 'cap',
            color: data.color || '', material: data.material || '100% cotton',
            origin: data.origin || 'Imported', price: Number(data.price) || 0,
            badge: data.badge || ''
          });
          if (r && r.description) {
            a.$('#q-desc').value = r.description;
            a.toast('Description generated', 'success');
          } else {
            a.toast('AI returned no text', 'error');
          }
        } catch (e) {
          a.toast('AI write failed: ' + e.message, 'error');
        } finally {
          btn.disabled = false; btn.textContent = orig;
        }
      });

      a.$('#q-save').addEventListener('click', async () => {
        const form = a.$('#quick-form');
        const data = Object.fromEntries(new FormData(form).entries());
        if (!data.name || !data.price) { a.toast('Name and price are required', 'error'); return; }
        const id = data.id && data.id.trim() ? data.id.trim() : autoSku(data.name, data.cat);
        const slug = data.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
        const body = {
          id: id, slug: 'czevip-' + slug, name: data.name, cat: data.cat,
          price: Number(data.price), compare_at: null,
          material: '100% cotton', origin: 'Imported', weight_lb: 0.3,
          badge: '', featured: false, new: true,
          sizes: ['One size'], colors: [],
          condition: 'new', availability: 'in_stock',
          primary_image: state.primaryIdx >= 0 ? state.images[state.primaryIdx] : '',
          images: state.images.slice(),
          description: data.desc || (data.name + ' from CZEVIP. Edit full description in the product editor.'),
          active: true
        };
        try {
          const r = await a.api('POST', '/products', body);
          a.toast(I('prod.created') + ': ' + r.id, 'success');
          a.closeModal();
          load();
        } catch (e) { a.toast(I('prod.saveFailed') + ': ' + e.message, 'error'); }
      });
    }

    a.$('#btn-seed').addEventListener('click', async () => {
      if (!confirm(I('dash.seed') + '?')) return;
      try {
        const r = await a.api('POST', '/seed-products');
        a.toast(I('dash.seeded', { n: r.inserted, s: r.skipped }), 'success');
        load();
      } catch (e) { a.toast(I('dash.seed') + ' failed: ' + e.message, 'error'); }
    });
    a.$('#bulk-action').addEventListener('change', refreshBulkBar);
    a.$('#bulk-clear').addEventListener('click', () => {
      selected.clear();
      a.$$('.row-check').forEach(cb => { cb.checked = false; cb.closest('tr').classList.remove('selected'); });
      refreshBulkBar();
    });
    a.$('#check-all').addEventListener('change', e => {
      const checked = e.target.checked;
      items.forEach(p => { if (checked) selected.add(p.id); else selected.delete(p.id); });
      a.$$('.row-check').forEach(cb => { cb.checked = checked; cb.closest('tr').classList.toggle('selected', checked); });
      refreshBulkBar();
    });
    a.$('#bulk-apply').addEventListener('click', async () => {
      const action = a.$('#bulk-action').value;
      if (!action) { a.toast(I('bulk.pickAction'), 'error'); return; }
      const ids = Array.from(selected);
      let value;
      if (action === 'set_price' || action === 'adjust_price' || action === 'set_badge') {
        value = a.$('#bulk-value').value;
        if (value === '') { a.toast('Value required', 'error'); return; }
      }
      if (action === 'set_availability') value = a.$('#bulk-availability').value;
      if (action === 'set_featured') value = true;
      try {
        const r = await a.api('POST', '/products/bulk', { ids, action, value });
        a.toast(I('bulk.applied', { n: r.updated }), 'success');
        selected.clear();
        load();
      } catch (e) { a.toast(I('bulk.failed') + ': ' + e.message, 'error'); }
    });
    a.$$('[data-filter]').forEach(group => {
      group.addEventListener('click', e => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        showAll = chip.getAttribute('data-val') === '1';
        group.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c === chip));
        selected.clear();
        load();
      });
    });
    document.addEventListener('cz-locale-change', () => load());
    load();
  })();
</script>
</body>
</html>
